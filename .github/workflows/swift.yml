# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.1"
    - name: Install SwiftLint
      run: brew install swiftlint
    - name: Check Linting
      run: swiftlint
    - name: Build xcdataModel
      run: xcrun momc Tests/Repositories/Resources/TestModel.xcdatamodeld Tests/Repositories/Resources/TestModel.momd
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --enable-code-coverage
